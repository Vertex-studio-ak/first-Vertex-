<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>New Tab — Vertex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #0d0d0f;
      --surface: #141416;
      --border:  rgba(255,255,255,0.07);
      --accent:  #5e9fff;
      --accent-dim: rgba(94, 159, 255, 0.15);
      --grad-start: #5e9fff;
      --grad-end:   #a78bfa;
      --bg-gradient: linear-gradient(135deg, var(--grad-start), var(--grad-end));
      --text:    #f0f0f5;
      --muted:   #8a8a96;
      --radius:  16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 60px;
      padding: 40px;
    }

    /* Clock */
    #clock { text-align: center; }
    #time {
      font-size: 88px;
      font-weight: 300;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1;
    }
    #date {
      font-size: 16px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Search box */
    #search-wrap {
      position: relative;
      width: 580px;
      max-width: 90%;
    }
    #search {
      width: 100%;
      height: 60px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      padding: 0 68px 0 28px;
      outline: none;
      transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    #search::placeholder { color: var(--muted); }
    #search:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 4px var(--accent-dim);
    }
    #search-btn {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      width: 44px; height: 44px;
      border-radius: 100px;
      background: var(--bg-gradient);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 200ms;
      box-shadow: 0 4px 12px var(--accent-dim);
    }
    #search-btn:hover { transform: translateY(-50%) scale(1.05); filter: brightness(1.1); }
    #search-btn svg { color: #fff; }

    /* Quick links */
    #quicklinks {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .qlink {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      transition: all 250ms;
      text-decoration: none;
      min-width: 100px;
    }
    .qlink:hover {
      background: rgba(255,255,255,0.06);
      transform: translateY(-4px);
      border-color: var(--accent-dim);
    }
    .qlink-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      background: rgba(255, 255, 255, 0.03);
      transition: background 200ms;
    }
    .qlink:hover .qlink-icon { background: var(--accent-dim); }
    .qlink-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

<!-- Clock -->
<div id="clock">
  <div id="time">00:00</div>
  <div id="date">...</div>
</div>

<!-- Search bar -->
<div id="search-wrap">
  <input id="search" type="text" placeholder="Search the web…" autocomplete="off" spellcheck="false"/>
  <button id="search-btn">
    <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/>
    </svg>
  </button>
</div>

<!-- Quick links -->
<div id="quicklinks">
  <a class="qlink" href="https://github.com" target="_self">
    <div class="qlink-icon">🐙</div>
    <span class="qlink-label">GitHub</span>
  </a>
  <a class="qlink" href="https://youtube.com" target="_self">
    <div class="qlink-icon">▶️</div>
    <span class="qlink-label">YouTube</span>
  </a>
  <a class="qlink" href="https://reddit.com" target="_self">
    <div class="qlink-icon">🤖</div>
    <span class="qlink-label">Reddit</span>
  </a>
  <a class="qlink" href="https://x.com" target="_self">
    <div class="qlink-icon">✖️</div>
    <span class="qlink-label">X</span>
  </a>
  <a class="qlink" href="https://wikipedia.org" target="_self">
    <div class="qlink-icon">📖</div>
    <span class="qlink-label">Wikipedia</span>
  </a>
  <a class="qlink" href="https://news.ycombinator.com" target="_self">
    <div class="qlink-icon">🟠</div>
    <span class="qlink-label">HN</span>
  </a>
</div>

<script>
  // Clock
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('time').textContent = `${h}:${m}`;
    const opts = { weekday:'long', day:'numeric', month:'long' };
    document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', opts); // Using RU locale for the user
  }
  updateClock();
  setInterval(updateClock, 15000);

  // Settings & Theme Synchronization
  let searchEngine = 'https://duckduckgo.com/?q=';
  const channel = new BroadcastChannel('vertex_internal');
  
  function applyTheme(s) {
    if (s.search_engine) searchEngine = s.search_engine;
    if (s.accent_start) {
      document.documentElement.style.setProperty('--accent', s.accent_start);
      document.documentElement.style.setProperty('--grad-start', s.accent_start);
      document.documentElement.style.setProperty('--accent-dim', s.accent_start + '26'); // 15% opacity hex
    }
    if (s.accent_end) {
      document.documentElement.style.setProperty('--grad-end', s.accent_end);
    }
    document.body.style.filter = s.theme === 'light' ? 'invert(0.9) hue-rotate(180deg)' : ''; // Simple light mode fallback
  }

  channel.onmessage = (e) => {
    if (e.data.type === 'settings_data' || e.data.type === 'save_settings') {
      applyTheme(e.data.settings);
    }
  };
  channel.postMessage({ type: 'get_settings' });

  const input = document.getElementById('search');
  const btn   = document.getElementById('search-btn');
  
  function doSearch() {
    const q = input.value.trim();
    if (!q) return;
    window.location.href = searchEngine + encodeURIComponent(q);
  }
  btn.addEventListener('click', doSearch);
  input.addEventListener('keydown', e => e.key === 'Enter' && doSearch());
  input.focus();
</script>

</body>
</html>
