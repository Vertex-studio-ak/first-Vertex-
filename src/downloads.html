<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Downloads</title>
  <style>
    :root {
      --bg-base:       #0d0d0f;
      --bg-surface:    #141416;
      --bg-elevated:   #1c1c1f;
      --glass-border:  rgba(255, 255, 255, 0.05);
      --text: #f0f0f5;
      --text-muted: #8a8a96;
      --accent: #5e9fff;
      --accent-dim: rgba(94, 159, 255, 0.15);
    }
    body {
      margin: 0; padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text);
      overflow-x: hidden;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; background: inherit; z-index: 10;
    }
    .header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    
    #downloads-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .download-item {
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .download-item:hover { border-color: var(--glass-border); }
    
    .item-header { display: flex; gap: 12px; align-items: flex-start; }
    .item-icon { font-size: 24px; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { 
      font-size: 13px; font-weight: 500; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .item-meta { font-size: 11px; color: var(--text-muted); }
    
    .progress-container { margin-top: 10px; }
    .progress-bar-bg {
      height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent); width: 0%;
      transition: width 0.3s ease;
    }
    
    .item-actions {
      display: flex; gap: 8px; margin-top: 12px;
    }
    .action-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .action-btn:hover { background: rgba(255,255,255,0.1); }
    .action-btn.danger:hover { background: rgba(255, 80, 80, 0.2); color: #ff8080; }
    
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 80%; color: var(--text-muted); text-align: center; padding: 20px;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  </style>
</head>
<body>

<div class="header">
  <h1>Downloads</h1>
</div>

<div id="downloads-list">
  <!-- Items injected by JS -->
  <div class="empty-state">
    <div class="empty-icon">📂</div>
    <p>No downloads yet</p>
  </div>
</div>

<script type="module">
  import { invoke } from 'https://cdn.jsdelivr.net/npm/@tauri-apps/api@2/core.js';
  import { listen } from 'https://cdn.jsdelivr.net/npm/@tauri-apps/api@2/event.js';

  const list = document.getElementById('downloads-list');

  async function render() {
    const items = await invoke('get_downloads');
    if (items.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <p>No downloads yet</p>
        </div>
      `;
      return;
    }
    
    list.innerHTML = items.map(item => createItemHtml(item)).reverse().join('');
    setupActions();
  }

  function createItemHtml(item) {
    const progress = item.total_bytes ? Math.round((item.downloaded_bytes / item.total_bytes) * 100) : 0;
    const isFinished = item.status === 'Finished';
    const isError = item.status === 'Error';
    
    return `
      <div class="download-item" data-id="${item.id}" data-path="${item.path || ''}">
        <div class="item-header">
          <div class="item-icon">${getFileIcon(item.name)}</div>
          <div class="item-info">
            <div class="item-name" title="${item.name}">${item.name}</div>
            <div class="item-meta">
              ${isFinished ? 'Completed' : (isError ? 'Error' : item.status)} • 
              ${formatBytes(item.downloaded_bytes)}${item.total_bytes ? ' / ' + formatBytes(item.total_bytes) : ''}
            </div>
          </div>
        </div>
        
        ${!isFinished && !isError ? `
          <div class="progress-container">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${progress}%"></div>
            </div>
          </div>
        ` : ''}
        
        <div class="item-actions">
          ${item.path ? `<button class="action-btn open-folder">Open Folder</button>` : ''}
          ${!isFinished && !isError ? `<button class="action-btn danger cancel-btn">Cancel</button>` : ''}
        </div>
      </div>
    `;
  }

  function setupActions() {
    document.querySelectorAll('.open-folder').forEach(btn => {
      btn.onclick = () => invoke('open_download_folder', { path: btn.closest('.download-item').dataset.path });
    });
    document.querySelectorAll('.cancel-btn').forEach(btn => {
      btn.onclick = () => invoke('cancel_download', { id: btn.closest('.download-item').dataset.id });
    });
  }

  function getFileIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    if (['jpg', 'png', 'gif', 'webp'].includes(ext)) return '🖼️';
    if (['pdf', 'doc', 'docx', 'txt'].includes(ext)) return '📄';
    if (['zip', 'rar', '7z'].includes(ext)) return '📦';
    if (['exe', 'msi', 'dmg'].includes(ext)) return '⚙️';
    return '📄';
  }

  function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  // Real-time updates
  listen('download-update', () => render());

  // Initial render
  render();
</script>

</body>
</html>
