<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Passwords — Vertex</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:      #0d0d0f;
      --surface: #141416;
      --elevated:#1c1c1f;
      --overlay: #222226;
      --hover:   #2a2a2f;
      --border:  rgba(255,255,255,0.07);
      --accent:  #5e9fff;
      --accent-dim: rgba(94,159,255,0.14);
      --text:    #f0f0f5;
      --muted:   #6a6a76;
      --danger:  #ff5f57;
      --green:   #34c759;
      --radius:  10px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; overflow: hidden; }

    /* ── Screens ─────────────────────────────────────── */
    .screen { display: none; flex-direction: column; height: 100vh; }
    .screen.active { display: flex; }

    /* ── Lock / Setup Screen ─────────────────────────── */
    #screen-lock, #screen-setup {
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .lock-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px 40px;
      width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    }
    .lock-icon {
      width: 56px; height: 56px;
      background: var(--accent-dim);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }
    .lock-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .lock-sub   { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; margin-top: -12px; }
    .lock-input {
      width: 100%;
      height: 44px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 0 16px;
      outline: none;
      transition: border-color 180ms;
      letter-spacing: 0.05em;
    }
    .lock-input:focus { border-color: rgba(94,159,255,0.5); box-shadow: 0 0 0 3px var(--accent-dim); }
    .lock-input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(255,95,87,0.15); }
    .lock-error { font-size: 12px; color: var(--danger); text-align: center; min-height: 16px; }
    .btn-primary {
      width: 100%;
      height: 44px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      transition: opacity 180ms, transform 100ms;
    }
    .btn-primary:hover   { opacity: 0.88; }
    .btn-primary:active  { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Main Vault Screen ───────────────────────────── */
    #screen-vault { overflow: hidden; }

    .vault-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .vault-header-title { font-size: 16px; font-weight: 600; flex: 1; }
    .vault-search {
      flex: 1;
      max-width: 320px;
      height: 34px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 0 14px;
      outline: none;
      transition: border-color 180ms;
    }
    .vault-search:focus { border-color: rgba(94,159,255,0.5); }
    .vault-search::placeholder { color: var(--muted); }
    .btn-icon {
      width: 34px; height: 34px;
      border-radius: var(--radius);
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 180ms, color 180ms;
    }
    .btn-icon:hover { background: var(--elevated); color: var(--text); }
    .btn-icon svg { width: 16px; height: 16px; }

    .btn-add {
      display: flex; align-items: center; gap: 6px;
      padding: 0 14px;
      height: 34px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 180ms;
    }
    .btn-add:hover { opacity: 0.85; }

    .vault-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--elevated); border-radius: 2px; }

    /* ── Entry Cards ─────────────────────────────────── */
    .entry-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      transition: border-color 180ms, background 180ms;
      cursor: default;
    }
    .entry-card:hover { border-color: rgba(94,159,255,0.2); background: var(--elevated); }
    .entry-favicon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--elevated);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .entry-favicon img { width: 20px; height: 20px; border-radius: 3px; }
    .entry-body { flex: 1; min-width: 0; }
    .entry-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-user  { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .entry-pw    { font-size: 11px; color: var(--muted); font-family: monospace; letter-spacing: 0.08em; }
    .entry-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .btn-sm {
      padding: 4px 10px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--elevated);
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: background 180ms, color 180ms;
    }
    .btn-sm:hover { background: var(--overlay); color: var(--text); }
    .btn-sm.danger:hover { background: rgba(255,95,87,0.15); color: var(--danger); border-color: rgba(255,95,87,0.3); }
    .btn-sm.copied { color: var(--green); border-color: rgba(52,199,89,0.3); }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60%;
      gap: 12px;
      color: var(--muted);
    }
    .empty-state-icon { font-size: 48px; opacity: 0.4; }
    .empty-state-text { font-size: 14px; font-weight: 500; color: var(--muted); }
    .empty-state-sub  { font-size: 12px; color: var(--muted); opacity: 0.7; }

    /* ── Modal Overlay ───────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
      animation: modalIn 200ms cubic-bezier(0.25,0.46,0.45,0.94);
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.93) translateY(-12px); } to { opacity: 1; transform: none; } }
    .modal-title { font-size: 16px; font-weight: 600; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .field-input {
      height: 40px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 0 12px;
      outline: none;
      transition: border-color 180ms;
    }
    .field-input:focus { border-color: rgba(94,159,255,0.5); box-shadow: 0 0 0 3px var(--accent-dim); }
    .pw-row { display: flex; gap: 8px; }
    .pw-row .field-input { flex: 1; font-family: monospace; letter-spacing: 0.05em; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel {
      height: 38px; padding: 0 18px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit; font-size: 13px;
      cursor: pointer;
      transition: background 180ms, color 180ms;
    }
    .btn-cancel:hover { background: var(--elevated); color: var(--text); }
    .btn-save {
      height: 38px; padding: 0 22px;
      border-radius: 100px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: opacity 180ms;
    }
    .btn-save:hover { opacity: 0.85; }
    .btn-save:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Password Generator ──────────────────────────── */
    .gen-row { display: flex; align-items: center; gap: 10px; margin-top: -8px; }
    .gen-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
      cursor: pointer;
    }
    .gen-length { font-size: 12px; font-weight: 600; color: var(--accent); min-width: 24px; text-align: right; }
    .gen-options { display: flex; gap: 14px; margin-top: -8px; }
    .chk-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
    .chk-label input { accent-color: var(--accent); width: 14px; height: 14px; }

    /* ── Toast ───────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--elevated); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 20px;
      font-size: 12px; color: var(--text);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none;
      transition: opacity 200ms;
      z-index: 9999;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- ── Lock Screen ─────────────────────────────────────── -->
<div id="screen-lock" class="screen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Vault Locked</div>
    <p class="lock-sub">Enter your master password to unlock your saved passwords.</p>
    <input id="lock-input" type="password" class="lock-input" placeholder="Master password…" autocomplete="current-password"/>
    <div id="lock-error" class="lock-error"></div>
    <button id="lock-btn" class="btn-primary">Unlock Vault</button>
  </div>
</div>

<!-- ── Setup Screen ────────────────────────────────────── -->
<div id="screen-setup" class="screen">
  <div class="lock-card">
    <div class="lock-icon">🛡️</div>
    <div class="lock-title">Create Vault</div>
    <p class="lock-sub">Choose a strong master password. This encrypts all your saved passwords — if you forget it, there's no recovery.</p>
    <input id="setup-pw1" type="password" class="lock-input" placeholder="Master password…" autocomplete="new-password"/>
    <input id="setup-pw2" type="password" class="lock-input" placeholder="Confirm master password…" autocomplete="new-password"/>
    <div id="setup-error" class="lock-error"></div>
    <button id="setup-btn" class="btn-primary">Create Vault</button>
  </div>
</div>

<!-- ── Main Vault Screen ───────────────────────────────── -->
<div id="screen-vault" class="screen">
  <div class="vault-header">
    <span class="vault-header-title">🔑 Passwords</span>
    <input id="search-input" class="vault-search" type="text" placeholder="Search entries…"/>
    <button class="btn-add" id="btn-add-entry">
      <svg viewBox="0 0 12 12" width="12" height="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/>
      </svg>
      Add Password
    </button>
    <button class="btn-icon" id="btn-lock-vault" title="Lock vault">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="7" width="10" height="8" rx="2"/>
        <path d="M5 7V5a3 3 0 0 1 6 0v2"/>
      </svg>
    </button>
  </div>

  <div class="vault-body" id="entry-list"></div>
</div>

<!-- ── Add / Edit Entry Modal ─────────────────────────── -->
<div id="modal-add" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Add Password</div>

    <div class="field-group">
      <label class="field-label">Website / Title</label>
      <input id="f-title" class="field-input" type="text" placeholder="e.g. GitHub"/>
    </div>
    <div class="field-group">
      <label class="field-label">URL</label>
      <input id="f-url" class="field-input" type="url" placeholder="https://github.com"/>
    </div>
    <div class="field-group">
      <label class="field-label">Username / Email</label>
      <input id="f-username" class="field-input" type="text" placeholder="you@example.com"/>
    </div>
    <div class="field-group">
      <label class="field-label">Password</label>
      <div class="pw-row">
        <input id="f-password" class="field-input" type="password" placeholder="Password…"/>
        <button class="btn-sm" id="btn-toggle-pw">Show</button>
        <button class="btn-sm" id="btn-gen-pw">Generate</button>
      </div>
    </div>

    <!-- Password Generator controls -->
    <div id="gen-section" style="display:none; flex-direction:column; gap:10px; padding:12px; background:var(--elevated); border-radius:var(--radius); border:1px solid var(--border);">
      <div class="gen-row">
        <span class="gen-label">Length</span>
        <input type="range" id="gen-slider" min="8" max="64" value="20"/>
        <span class="gen-length" id="gen-length-lbl">20</span>
      </div>
      <div class="gen-options">
        <label class="chk-label"><input type="checkbox" id="gen-symbols" checked/> Symbols (!@#…)</label>
        <label class="chk-label"><input type="checkbox" id="gen-digits" checked disabled/> Digits (always on)</label>
      </div>
      <button class="btn-sm" id="btn-refresh-gen" style="width:fit-content">↺ Regenerate</button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-modal-cancel">Cancel</button>
      <button class="btn-save" id="btn-modal-save">Save Password</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { invoke } from 'https://cdn.jsdelivr.net/npm/@tauri-apps/api@2/core.js';

// ── Screen management ─────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Toast ─────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Init ──────────────────────────────────────────────
async function init() {
  const setup = await invoke('vault_is_setup');
  if (!setup) { showScreen('screen-setup'); return; }
  const locked = await invoke('vault_is_locked');
  if (locked) { showScreen('screen-lock'); return; }
  showScreen('screen-vault');
  loadEntries();
}

// ── Setup Screen ──────────────────────────────────────
document.getElementById('setup-btn').addEventListener('click', async () => {
  const pw1 = document.getElementById('setup-pw1').value;
  const pw2 = document.getElementById('setup-pw2').value;
  const err = document.getElementById('setup-error');
  if (!pw1) { err.textContent = 'Password cannot be empty'; return; }
  if (pw1 !== pw2) { err.textContent = 'Passwords do not match'; return; }
  if (pw1.length < 8) { err.textContent = 'Use at least 8 characters'; return; }
  err.textContent = '';
  try {
    await invoke('vault_setup', { masterPw: pw1 });
    showScreen('screen-vault');
    loadEntries();
  } catch (e) { err.textContent = e; }
});

// ── Lock Screen ───────────────────────────────────────
document.getElementById('lock-btn').addEventListener('click', unlockVault);
document.getElementById('lock-input').addEventListener('keydown', e => { if (e.key === 'Enter') unlockVault(); });

async function unlockVault() {
  const pw = document.getElementById('lock-input').value;
  const inp = document.getElementById('lock-input');
  const err = document.getElementById('lock-error');
  err.textContent = '';
  inp.classList.remove('error');
  try {
    const ok = await invoke('vault_unlock', { masterPw: pw });
    if (ok) {
      document.getElementById('lock-input').value = '';
      showScreen('screen-vault');
      loadEntries();
    } else {
      err.textContent = 'Incorrect master password';
      inp.classList.add('error');
      inp.focus();
    }
  } catch(e) { err.textContent = String(e); }
}

// ── Lock vault button ─────────────────────────────────
document.getElementById('btn-lock-vault').addEventListener('click', async () => {
  await invoke('vault_lock');
  showScreen('screen-lock');
  document.getElementById('lock-input').focus();
});

// ── Entry List ────────────────────────────────────────
let allEntries = [];

async function loadEntries() {
  try {
    allEntries = await invoke('vault_get_entries');
    renderEntries(allEntries);
  } catch(e) {
    if (String(e).includes('locked')) { showScreen('screen-lock'); }
  }
}

function renderEntries(entries) {
  const list = document.getElementById('entry-list');
  if (entries.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">🔐</div>
        <div class="empty-state-text">No passwords yet</div>
        <div class="empty-state-sub">Click "+ Add Password" to save your first entry</div>
      </div>`;
    return;
  }
  const domain = url => { try { return new URL(url).hostname; } catch { return ''; } };
  list.innerHTML = entries.map(e => `
    <div class="entry-card" data-id="${e.id}">
      <div class="entry-favicon">
        <img src="https://www.google.com/s2/favicons?sz=40&domain=${domain(e.url)}"
             onerror="this.style.display='none'" alt=""/>
      </div>
      <div class="entry-body">
        <div class="entry-title">${esc(e.title)}</div>
        <div class="entry-user">${esc(e.username)}</div>
        <div class="entry-pw">${'•'.repeat(Math.min(e.password.length, 14))}</div>
      </div>
      <div class="entry-actions">
        <button class="btn-sm copy-user" data-val="${esc(e.username)}">Copy user</button>
        <button class="btn-sm copy-pw"  data-val="${esc(e.password)}">Copy pw</button>
        <button class="btn-sm danger delete-btn">Delete</button>
      </div>
    </div>`).join('');

  // Bind copy buttons
  list.querySelectorAll('.copy-user, .copy-pw').forEach(btn => {
    btn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(btn.dataset.val);
      const orig = btn.textContent;
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
    });
  });

  // Bind delete buttons
  list.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.closest('.entry-card').dataset.id;
      if (!confirm('Delete this password?')) return;
      await invoke('vault_delete_entry', { id });
      loadEntries();
    });
  });
}

// ── Search ────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderEntries(q ? allEntries.filter(en =>
    en.title.toLowerCase().includes(q) ||
    en.url.toLowerCase().includes(q) ||
    en.username.toLowerCase().includes(q)
  ) : allEntries);
});

// ── Add Entry Modal ───────────────────────────────────
const modal = document.getElementById('modal-add');
document.getElementById('btn-add-entry').addEventListener('click', openModal);
document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

function openModal() {
  ['f-title','f-url','f-username','f-password'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('gen-section').style.display = 'none';
  modal.classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 60);
}
function closeModal() { modal.classList.remove('open'); }

document.getElementById('btn-modal-save').addEventListener('click', async () => {
  const title    = document.getElementById('f-title').value.trim();
  const url      = document.getElementById('f-url').value.trim();
  const username = document.getElementById('f-username').value.trim();
  const password = document.getElementById('f-password').value;
  if (!title || !username || !password) { toast('Please fill in all required fields'); return; }
  const btn = document.getElementById('btn-modal-save');
  btn.disabled = true;
  try {
    await invoke('vault_add_entry', { title, url, username, password });
    closeModal();
    loadEntries();
    toast('Password saved securely 🔐');
  } catch(e) { toast('Error: ' + e); }
  btn.disabled = false;
});

// ── Password toggle ───────────────────────────────────
document.getElementById('btn-toggle-pw').addEventListener('click', () => {
  const inp = document.getElementById('f-password');
  const btn = document.getElementById('btn-toggle-pw');
  const isHidden = inp.type === 'password';
  inp.type = isHidden ? 'text' : 'password';
  btn.textContent = isHidden ? 'Hide' : 'Show';
});

// ── Password Generator ────────────────────────────────
const genSection = document.getElementById('gen-section');
const genSlider  = document.getElementById('gen-slider');
const genLabel   = document.getElementById('gen-length-lbl');

document.getElementById('btn-gen-pw').addEventListener('click', () => {
  const visible = genSection.style.display !== 'none';
  genSection.style.display = visible ? 'none' : 'flex';
  if (!visible) regenerate();
});

genSlider.addEventListener('input', () => { genLabel.textContent = genSlider.value; regenerate(); });
document.getElementById('gen-symbols').addEventListener('change', regenerate);
document.getElementById('btn-refresh-gen').addEventListener('click', regenerate);

async function regenerate() {
  genLabel.textContent = genSlider.value;
  const pw = await invoke('vault_generate_password', {
    length: parseInt(genSlider.value),
    symbols: document.getElementById('gen-symbols').checked,
  });
  const inp = document.getElementById('f-password');
  inp.value = pw;
  inp.type = 'text';
  document.getElementById('btn-toggle-pw').textContent = 'Hide';
}

// ── Helpers ───────────────────────────────────────────
function esc(s = '') {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ──────────────────────────────────────────────
init();
</script>
</body>
</html>
